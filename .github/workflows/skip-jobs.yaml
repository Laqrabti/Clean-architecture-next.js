name: Smart Pipeline
on:
  push:
    branches: [main, pair-extra, feature/*] # Added feature/* to include feature/read.md
  pull_request:
    branches: [main, pair-extra, feature/*]

jobs:
  # 1. Analyze what changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect what changed
        id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            docs:
              - 'readme.md' # Specific to readme.md
              - 'README.md'
              - 'docs/**'
              - '.github/workflows/**' 
            frontend:
              - 'frontend/**'
              - 'src/components/**'
              - '*.js'
              - '*.jsx'
              - '*.ts'
              - '*.tsx'
            backend:
              - '*.py'
              - '*.java'
            config:
              - '*.json'


  # 2. Run if frontend code changed
  frontend-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run frontend tests
        run: echo "Running expensive frontend tests..." # Replace with actual test command

  # 3. Run if backend code changed
  backend-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run backend tests
        run: echo "Running expensive backend tests..." # Replace with actual test command

  # 4. Run if frontend or backend changed
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Build project
        run: echo "Building the entire project..." # Replace with actual build command
      - name: Deploy
        run: echo "Deploying to environment..." # Replace with actual deploy command

  # 5. Run for documentation changes
  docs-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        run: echo "Quick documentation validation" # Replace with actual validation command