name: 'Terraform Deployment'
on:
  push:
    branches: [develop, main, release/*]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Select environment'
        options: ['dev', 'staging', 'prod']
        required: true

env:
  TF_VERSION: '1.5.0'
  AWS_REGION: 'us-east-1'

  
jobs:
  determine-environment:
    name: 'Determine Environment'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-environment.outputs.environment }}
      tfvars_file: ${{ steps.set-environment.outputs.tfvars_file }}
    steps:
    - name: Set environment based on branch or input
      id: set-environment
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "environment=prod" >> $GITHUB_OUTPUT
        elif [ "${{ github.ref }}" = "refs/heads/release/*" ]; then
          echo "environment=staging" >> $GITHUB_OUTPUT
        else
          echo "environment=dev" >> $GITHUB_OUTPUT
        fi
        
        echo "tfvars_file=environments/${{ steps.set-environment.outputs.environment }}/terraform.tfvars" >> $GITHUB_OUTPUT

  terraform-plan:
    name: 'Terraform Plan - ${{ needs.determine-environment.outputs.environment }}'
    runs-on: ubuntu-latest
    needs: determine-environment
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Init
      run: |
        cd environments/${{ needs.determine-environment.outputs.environment }}
        terraform init

    - name: Terraform Format
      run: |
        cd environments/${{ needs.determine-environment.outputs.environment }}
        terraform fmt -check

    - name: Terraform Validate
      run: |
        cd environments/${{ needs.determine-environment.outputs.environment }}
        terraform validate

    - name: Terraform Plan
      run: |
        cd environments/${{ needs.determine-environment.outputs.environment }}
        terraform plan -var-file="${{ needs.determine-environment.outputs.tfvars_file }}" -out=tfplan

    - name: Upload Plan Artifact
      uses: actions/upload-artifact@v3
      with:
        name: tfplan-${{ needs.determine-environment.outputs.environment }}
        path: environments/${{ needs.determine-environment.outputs.environment }}/tfplan

  terraform-apply:
    name: 'Terraform Apply - ${{ needs.determine-environment.outputs.environment }}'
    runs-on: ubuntu-latest
    needs: [determine-environment, terraform-plan]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: 
      name: ${{ needs.determine-environment.outputs.environment }}
      url: ${{ steps.apply.outputs.url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Plan Artifact
      uses: actions/download-artifact@v3
      with:
        name: tfplan-${{ needs.determine-environment.outputs.environment }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Apply
      id: apply
      run: |
        cd environments/${{ needs.determine-environment.outputs.environment }}
        terraform apply -auto-approve tfplan
        echo "url=https://console.aws.amazon.com" >> $GITHUB_OUTPUT