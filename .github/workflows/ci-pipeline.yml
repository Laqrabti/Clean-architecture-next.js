name: CI Pipeline

on:
  push:
    branches: [ test* ]  # Triggers on push to any branch starting with "test"
  pull_request:
    branches: [ main, develop ]  # Triggers on PRs to main/develop

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests with Vitest
      run: npm test
    


